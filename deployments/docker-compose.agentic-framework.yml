# Agentic Framework backend (API + LangGraph orchestration + agents).
#
# Same project name / network as docker-compose.fabric.yml so the two -f files
# merge into one stack. Kafka is provided by the fabric compose:
#
#   docker compose \
#     -f deployments/docker-compose.fabric.yml \
#     -f deployments/docker-compose.agentic-framework.yml up
#
# Temporal is always-on in this stack: the temporal plane + worker below start
# with the stack, and TEMPORAL_ENABLED / KAFKA_ENABLED are forced on in each
# service's environment. Kafka (from the fabric compose) bridges worker-emitted
# WS events to the API relay, so approvals raised on the worker reach the browser
# -- with Kafka off, broadcast() falls back to process-local delivery and the
# worker's approval_required never reaches the browser (modal never appears).
name: hospilot-oss

services:

  # ── Agentic Framework (API + LangGraph orchestration) ─────────────────────
  backend:
    build:
      context: ../agentic-framework
      dockerfile: ../deployments/agentic-framework.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../agentic-framework:/app
    env_file:
      - ../agentic-framework/.env
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      # FABRIC_BASE_URL intentionally not overridden here -- takes whatever's in
      # agentic-framework/.env (local fabric container vs. the real remote one).
      TEMPORAL_HOST: temporal:7233
      # Route agent tasks to Temporal and bridge worker-emitted WS events over
      # Kafka. Forced on here so the stack does not depend on the local .env.
      TEMPORAL_ENABLED: "true"
      KAFKA_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospilot-oss-net

  # ── Temporal worker (runs agent-task activities + escalation workflows) ────
  # Always-on. KAFKA_ENABLED=true so broadcast() from activities publishes to
  # Kafka -> API relay -> browser WS; deliver_local here would be process-local
  # and never reach the browser (this is what left approvals stuck).
  worker:
    build:
      context: ../agentic-framework
      dockerfile: ../deployments/agentic-framework.Dockerfile
    command: python -m workflows.temporal.worker.run_worker
    volumes:
      - ../agentic-framework:/app
    env_file:
      - ../agentic-framework/.env
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      # FABRIC_BASE_URL intentionally not overridden here -- takes whatever's in
      # agentic-framework/.env (local fabric container vs. the real remote one).
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_ENABLED: "true"
      KAFKA_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospilot-oss-net

  # ── Redis (session/queue/HITL/staging state) ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - hospilot-oss-net

  # ── Temporal durable execution plane (server + UI + its Postgres) ──────────
  # Ported from the internal deployment. Always-on alongside the worker above.
  # Web UI -> http://localhost:8088
  temporal-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hospilot-oss-net

  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hospilot-oss-net

  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - hospilot-oss-net

networks:
  hospilot-oss-net:
    name: hospilot-oss-net

volumes:
  temporal_pgdata:
