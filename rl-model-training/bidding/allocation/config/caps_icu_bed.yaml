resource_type: icu_bed

status: configured

components:
  clinical_benefit:
    cap: 60
    meaning: Expected reduction in harm/mortality
  urgency:
    cap: 40
    meaning: How soon ICU care is needed
  waiting:
    cap: 25
    meaning: Harm caused by additional waiting
  throughput:
    cap: 25
    meaning: Beds/queues/workflows unlocked
  operational:
    cap: 20
    meaning: Cancellation, bottlenecks, staff utilisation
  financial:
    cap: 10
    meaning: Revenue / financial consequence
  alternative:
    cap: -20
    meaning: HDU, delay, transfer, recovery room
  resource_stress:
    cap: -10
    meaning: Staffing, isolation, equipment constraints

# Factor weights within each component. RL-Steps' own weights, unchanged.
# A factor whose input is absent is DROPPED and the component renormalised over the weights
# present (D.0). It is never scored 0.
weights:
  clinical_benefit:
    deterioration_risk: 0.30
    unit_benefit: 0.25         # per-resource rule table; no model — B.10
    oxygen_severity: 0.20
    organ_risk: 0.15
    age_comorbidity: 0.10      # no DOB in hospilot.patients — permanently absent for now
  urgency:
    news2: 0.35
    oxygen_trend: 0.30
    vital_trend: 0.20
    time_to_critical: 0.15     # no model — B.5
  throughput:
    bed_release: 0.40
    nursing_capacity: 0.30
    queue_impact: 0.20
    downstream_impact: 0.10
  financial:
    expected_revenue: 0.40
    avoided_cost: 0.30         # no cost table — B.6
    capacity_value: 0.30
  resource_stress:
    occupancy: 0.50
    demand_pressure: 0.30
    isolation_pressure: 0.20

# waiting, operational and alternative are products, not weighted sums — see D.3, D.5, D.7.
